[build-system]
requires = [
    "setuptools>=80.9.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-kunlun"
version = "0.25.1.dev0"
description = "vLLM Kunlun3 backend plugin"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vLLM-Kunlun team" }]
dependencies = []

[project.entry-points."vllm.platform_plugins"]
kunlun = "vllm_kunlun:register"

[project.entry-points."vllm.general_plugins"]
kunlun_model = "vllm_kunlun:register_model"
kunlun_reasoning_parser = "vllm_kunlun:register_reasoning_parser"
kunlun_tool_parser = "vllm_kunlun:register_tool_parser"

[project.entry-points."vllm.plugins"]
kunlun_fused_moe = "vllm_kunlun.ops.fused_moe:register_kunlun_fused_moe_ops"

[tool.setuptools.packages.find]
include = ["vllm_kunlun*"]

[tool.setuptools.package-data]
vllm_kunlun = [
    "conf/*",
    "data/*",
    "so/*.so",
    "include/*.h",
    "_kunlun*.so",
]
